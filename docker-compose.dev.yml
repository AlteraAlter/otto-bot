services:
  postgres:
    image: postgres:16-alpine
    container_name: otto-bot-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: otto-bot-redis-dev
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: otto-bot-mongodb-dev
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otto-bot-backend-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - docker.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: otto_bot
      ARQ_REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: arq:otto-bot
      FRONTEND_APP_URL: http://127.0.0.1:3000
      UPLOADS_DIR: /app/uploads
      GENERATED_MEDIA_ROOT: /app/storage/generated
      GENERATED_MEDIA_URL_PREFIX: /generated-media
    ports:
      - "8000:8000"
    volumes:
      - uploads-data:/app/uploads
      - generated-media-data:/app/storage/generated
      - backend-logs:/app/logs
      - ./temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: otto-bot-frontend-dev
    environment:
      NODE_ENV: development
      BACKEND_BASE_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    stdin_open: "true"
    tty: true
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: otto-bot-nginx
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/uploads:/var/www/uploads:ro
      - ./storage/generated:/var/www/generated-media:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  uploads-data:
  generated-media-data:
  backend-logs:
